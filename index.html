<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#E8EAE4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Read faster and understand more: one phrase at a time, with speaker cues, word help and a reading guide.">
<title>Fixate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fixate">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-flash" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="3"/><path d="M11 10v4"/></symbol>
  <symbol id="i-page" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 5h3v14h-3zM13.5 5h3v14h-3z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-prev2" viewBox="0 0 24 24"><path d="M11 17 6 12l5-5M18 17l-5-5 5-5"/></symbol>
  <symbol id="i-next2" viewBox="0 0 24 24"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 18.5V6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H8z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.3c1.6.6 2.6 2.2 3 4.7"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 4h11v16.5L12 16.5l-5.5 4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.5z"/></symbol>
  <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4" height="6.5" rx="1.6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
</svg>
<div class="app" id="app">
  <header>
    <button class="titlebtn" id="bookBtn" aria-haspopup="dialog">
      <span class="t1"><span id="hTitle"></span><svg class="i"><use href="#i-down"/></svg></span>
      <span class="t2"><span id="hCh"></span><span id="place"></span></span>
    </button>
    <div class="viewsw" role="group" aria-label="View">
      <button data-view="flash" aria-pressed="true" title="Flash view"><svg class="i"><use href="#i-flash"/></svg><span>Flash</span></button>
      <button data-view="page" aria-pressed="false" title="Page view"><svg class="i"><use href="#i-page"/></svg><span>Page</span></button>
    </div>
    <button class="hbtn" id="guideBtn" aria-haspopup="dialog" aria-label="Reading guide" title="Reading guide"><svg class="i"><use href="#i-compass"/></svg></button>
    <button class="hbtn" id="menuBtn" aria-haspopup="dialog" aria-label="Menu" title="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  </header>
  <main>
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Reader. Tap to play or pause, drag sideways to scrub.">
      <div class="rule t"></div><div class="rule b"></div>
      <div class="tick t" id="tickT"></div><div class="tick b" id="tickB"></div>
      <div class="who" id="who"></div>
      <div class="word" id="word" aria-live="off"></div>
      <div class="hint" id="hint">Loading your book…</div>
      <button class="btn tonal listen" id="listenBtn" hidden aria-pressed="false" title="Read along with the audiobook"><svg class="i" aria-hidden="true"><use href="#i-headphones"/></svg><span>Listen</span></button>
    </div>
    <div class="context" id="context" aria-label="Surrounding text. Tap a word for its meaning."></div>
    <div class="page" id="page" aria-label="Page view. Tap a word for its meaning."></div>
    <div class="quiz" id="quiz" aria-live="polite"></div>
  </main>
  <footer>
    <div class="meta"><span id="pos">0%</span><span id="left">—</span></div>
    <input type="range" id="scrub" min="0" value="0" aria-label="Position in book">
    <div class="transport">
      <button class="ctl sm" id="sentBack" aria-label="Previous sentence" title="Previous sentence"><svg class="i"><use href="#i-prev2"/></svg></button>
      <button class="ctl" id="stepBack" aria-label="Back one step" title="Back"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="ctl play" id="play" aria-label="Play"><svg class="i" id="playIcon"><use href="#i-play"/></svg></button>
      <button class="ctl" id="stepFwd" aria-label="Forward one step" title="Forward"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="ctl sm" id="sentFwd" aria-label="Next sentence" title="Next sentence"><svg class="i"><use href="#i-next2"/></svg></button>
    </div>
    <div class="speed">
      <button id="slower" aria-label="Slower"><svg class="i"><use href="#i-minus"/></svg></button>
      <input type="range" id="speed" min="100" max="1000" step="25" value="300" aria-label="Target words per minute">
      <button id="faster" aria-label="Faster"><svg class="i"><use href="#i-plus"/></svg></button>
      <div class="wpm"><span id="wpmVal">300</span> <small>wpm</small></div>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><span class="acts" id="toastActs"></span></div>

<dialog id="sheet" aria-label="Menu">
  <div class="grab" id="grab" aria-hidden="true"></div>
  <div class="tabs" id="tabs"><div class="tl" role="tablist" aria-label="Menu sections">
    <button role="tab" data-tab="chapters"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg><span>Book</span></button>
    <button role="tab" data-tab="guide"><svg class="i" aria-hidden="true"><use href="#i-compass"/></svg><span>Guide</span></button>
    <button role="tab" data-tab="cast"><svg class="i" aria-hidden="true"><use href="#i-people"/></svg><span>Cast</span></button>
    <button role="tab" data-tab="words"><svg class="i" aria-hidden="true"><use href="#i-bookmark"/></svg><span>Words</span></button>
    <button role="tab" data-tab="stats"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg><span>Stats</span></button>
    <button role="tab" data-tab="settings"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg><span>Settings</span></button></div>
    <button class="x" id="closeSheet" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button>
  </div>
  <div class="panel" data-panel="chapters" role="tabpanel"><div id="library"></div><ol class="list" id="chapList"></ol></div>
  <div class="panel" data-panel="guide" role="tabpanel" hidden><div class="guide" id="guidePanel"></div></div>
  <div class="panel" data-panel="cast" role="tabpanel" hidden><div id="castList"></div></div>
  <div class="panel" data-panel="words" role="tabpanel" hidden><div class="stats" id="wordsPanel"></div></div>
  <div class="panel" data-panel="stats" role="tabpanel" hidden><div class="stats" id="stats"></div></div>
  <div class="panel" data-panel="settings" role="tabpanel" hidden><div class="set" id="setSet"></div></div>
</dialog>
<script src="app.js" defer></script>
</body>
</html>
